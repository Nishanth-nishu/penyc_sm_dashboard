# SearXNG settings for the private, per-job instance started by searxng_env.sh.
# The port and secret placeholders are substituted at job start. Everything not listed here
# comes from the SearXNG defaults (searx/settings.yml in the checkout).
use_default_settings: true

general:
  instance_name: "penny-search"
  debug: false
  enable_metrics: true
  privacypolicy_url: false
  donation_url: false
  contact_url: false

search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "en"
  max_page: 3
  formats:
    - html
    - json          # the pipeline reads /search?format=json

server:
  port: __PORT__
  bind_address: "127.0.0.1"
  secret_key: "__SECRET__"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 12.0
  max_request_timeout: 25.0
  pool_connections: 50
  pool_maxsize: 10
  enable_http2: true

# Engines (merged by name into the SearXNG defaults). Measured from Ada compute nodes on 30 Oct 2026:
#   yahoo       : answers reliably with real results
#   duckduckgo  : real results, intermittent CAPTCHA (SearXNG suspends it for a while, then retries)
#   brave       : real results until "too many requests" (suspended ~minutes); keep the query rate low
#   mojeek, startpage : enabled as extra general engines (startpage may CAPTCHA datacenter IPs)
#   bing        : OFF - ignores the query from this network and returns unrelated trending pages
#   google, qwant : OFF - "access denied" from datacenter IPs; google cse needs an API key (429 without)
#   wikipedia   : OFF - HTTP 400 from here; not a general web engine anyway
engines:
  - name: yahoo
    engine: yahoo
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
  - name: brave
    engine: brave
    disabled: false
  - name: mojeek
    engine: mojeek
    disabled: false
  - name: startpage
    engine: startpage
    disabled: false
  - name: bing
    engine: bing
    disabled: true
  - name: google
    engine: google
    disabled: true
  - name: google cse
    engine: google_cse
    disabled: true
  - name: qwant
    engine: qwant
    disabled: true
  - name: wikipedia
    engine: wikipedia
    disabled: true
