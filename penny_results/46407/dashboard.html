<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const C = DATA.companies, M = DATA.meta;
  const $ = (id) => document.getElementById(id);
  const fmt = {
    money(v, cur) { if (v == null) return '–'; const s = cur === 'INR' ? '₹' : (cur === 'USD' ? '$' : (cur || '') + ' ');
      if (v >= 1e9) return s + (v / 1e9).toFixed(2) + 'B'; if (v >= 1e6) return s + (v / 1e6).toFixed(1) + 'M'; return s + Math.round(v).toLocaleString(); },
    price(v, cur) { if (v == null) return '–'; return (cur === 'INR' ? '₹' : cur === 'USD' ? '$' : '') + v.toFixed(2); },
    n(v) { return v == null ? '–' : (+v).toLocaleString(); },
    when(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso;
      const utc = d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
      const ist = new Date(d.getTime() + 5.5 * 3600e3).toISOString().slice(0, 16).replace('T', ' ') + ' IST'; return utc + ' · ' + ist; }
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  function flags(c) {
    const r = c.regulatory || {}, out = [];
    if (r.going_concern) out.push(['critical', '⚠', 'going concern']);
    if (r.shell_flag) out.push(['critical', '⚠', 'shell']);
    if (r.reverse_merger) out.push(['serious', '◆', 'reverse merger']);
    if (r.auditor_changes_24m) out.push(['warn', '●', r.auditor_changes_24m + ' auditor change' + (r.auditor_changes_24m > 1 ? 's' : '')]);
    if ((r.enforcement_hits || []).length) out.push(['critical', '⚠', 'enforcement']);
    if ((c.insider || {}).officer_buys_12m) out.push(['good', '▲', c.insider.officer_buys_12m + ' insider buy' + (c.insider.officer_buys_12m > 1 ? 's' : '')]);
    if (!out.length) out.push(['neutral', '', 'none found']);
    return out;
  }
  const cov = (c) => (c.coverage && c.coverage.score) || 0;
  const peopleN = (c) => (c.coverage && c.coverage.named_people) || 0;
  const flagged = (c) => c.regulatory && (c.regulatory.going_concern || c.regulatory.shell_flag);

  // header + sectors
  $('run').textContent = 'Run ' + M.run_id + ' · generated ' + fmt.when(M.generated_at) + ' · ' + M.n + ' companies';
  [...new Set(C.map(c => c.sector_bucket).filter(Boolean))].sort().forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; $('sector').appendChild(o); });
  $('note').innerHTML = '<b>Read the score with its coverage.</b> Score 0–100 = leadership ' + M.weights.leadership + '% + technical bench ' + M.weights.technical_bench + '% + momentum ' + M.weights.momentum + '% + density ' + M.weights.density + '% − integrity penalty (up to ' + M.weights.integrity + '). Coverage (0–1) says how much of the company\'s workforce the score actually saw. ' + (M.gaps || []).join(' ');

  let sortK = 'rank', sortAsc = true, selId = null;
  const val = (c, k) => ({ rank: c.rank, name: c.name, price: c.price, mcap: c.mcap, score: c.score, cov: cov(c), people: peopleN(c), headcount: (c.headcount || {}).total })[k];
  function filtered() {
    const q = $('q').value.trim().toLowerCase(), m = $('market').value, s = $('sector').value, mc = +$('mincov').value, hf = $('hideflag').checked;
    return C.filter(c => (!m || c.market === m) && (!s || c.sector_bucket === s) && cov(c) >= mc - 1e-9 && !(hf && flagged(c))
      && (!q || [c.ticker, c.name, c.sector, c.industry, c.exchange].join(' ').toLowerCase().includes(q)));
  }
  function render() {
    const rows = filtered().sort((a, b) => { const x = val(a, sortK), y = val(b, sortK); const r = (x == null) - (y == null) || (x > y) - (x < y) || (typeof x === 'string' ? 0 : 0); return sortAsc ? r : -r; });
    const sc = rows.map(c => c.score).filter(v => v != null).sort((a, b) => a - b);
    const med = sc.length ? sc[Math.floor(sc.length / 2)] : null;
    $('tiles').innerHTML = [
      ['Companies shown', rows.length, rows.filter(c => c.market === 'us').length + ' US · ' + rows.filter(c => c.market === 'india').length + ' India'],
      ['Median talent score', med == null ? '–' : med.toFixed(1), 'top: ' + (sc.length ? sc[sc.length - 1].toFixed(1) : '–')],
      ['Coverage ≥ 0.4', rows.filter(c => cov(c) >= 0.4).length, 'scores you can lean on'],
      ['Going concern / shell', rows.filter(flagged).length, 'integrity-flagged'],
      ['Named people', rows.reduce((a, c) => a + peopleN(c), 0), 'resolved profiles across shown companies'],
    ].map(t => `<div class="tile"><div class="k">${t[0]}</div><div class="v">${t[1]}</div><div class="s">${esc(t[2])}</div></div>`).join('');
    $('empty').hidden = rows.length > 0;
    $('rows').innerHTML = rows.map(c => {
      const s = c.score == null ? 0 : c.score, cls = s >= 60 ? 'hi' : s >= 35 ? 'mid' : 'lo';
      const cv = Math.round(cov(c) * 5);
      return `<tr class="row${c.company_id === selId ? ' sel' : ''}" data-id="${esc(c.company_id)}" tabindex="0">
        <td class="num">${c.rank}</td>
        <td><div class="co"><span class="n">${esc(c.ticker)} <span style="color:var(--fg-2);font-weight:400">${esc(c.name)}</span></span>
          <span class="t"><span class="pill ${c.market}">${c.market}</span><span>${esc(c.exchange || '')}</span><span>${esc(c.sector_bucket || '')}</span></span></div></td>
        <td class="r num">${fmt.price(c.price, c.currency)}</td><td class="r num">${fmt.money(c.mcap, c.currency)}</td>
        <td><div class="bar" title="talent score ${s}"><div class="track"><div class="fill ${cls}" style="width:${s}%"></div></div><span class="val num">${c.score == null ? '–' : s.toFixed(0)}</span></div></td>
        <td><span class="meter" title="coverage ${cov(c).toFixed(2)}">${[0, 1, 2, 3, 4].map(i => `<i class="${i < cv ? 'on' : ''}"></i>`).join('')}</span> <span class="num" style="font-size:12px;color:var(--fg-2)">${cov(c).toFixed(2)}</span></td>
        <td class="num">${peopleN(c)}</td><td class="r num">${fmt.n((c.headcount || {}).total)}</td>
        <td><div class="chips">${flags(c).slice(0, 3).map(f => `<span class="chip ${f[0]}">${f[1]} ${esc(f[2])}</span>`).join('')}</div></td></tr>`;
    }).join('');
  }
  function spark(ts) {
    if (!ts || ts.length < 2) return '<div style="font-size:12px;color:var(--fg-3)">' + (ts && ts.length === 1 ? 'one data point: ' + fmt.n(ts[0].value) + ' (' + ts[0].date + ')' : 'no time series yet') + '</div>';
    const W = 560, H = 56, px = 34, py = 10, xs = ts.map(p => new Date(p.date).getTime()), ys = ts.map(p => p.value);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = t => px + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - 2 * px), Y = v => H - py - (y1 === y0 ? .5 : (v - y0) / (y1 - y0)) * (H - 2 * py);
    const pts = ts.map((p, i) => [X(xs[i]), Y(ys[i])]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="headcount over time"><path class="area" d="${d} L${last[0].toFixed(1)} ${H - py} L${pts[0][0].toFixed(1)} ${H - py} Z"/><path class="line" d="${d}"/>
      <circle class="dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4"/><text x="${pts[0][0]}" y="${H - 1}" text-anchor="start">${ts[0].date}</text><text x="${last[0]}" y="${H - 1}" text-anchor="end">${ts[ts.length - 1].date}</text>
      <text x="${(last[0] + 6).toFixed(1)}" y="${(last[1] + 3).toFixed(1)}">${fmt.n(ys[ys.length - 1])}</text></svg>`;
  }
  function open(id) {
    const c = C.find(x => x.company_id === id); if (!c) return;
    selId = id; render();
    const k = c.components || {}, w = M.weights;
    const comps = [['leadership', 'Leadership', 'var(--s1)'], ['technical_bench', 'Technical bench', 'var(--s2)'], ['momentum', 'Momentum', 'var(--s3)'], ['density', 'Talent density', 'var(--s4)'], ['integrity', 'Integrity penalty', 'var(--s8)']];
    const h = c.headcount || {}, g = h.growth_percent || {};
    const links = [c.website ? `<a href="${esc(c.website)}" target="_blank" rel="noopener">website</a>` : '', ...(c.sources || []).slice(0, 4).map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">source ${i + 1}</a>`)].filter(Boolean).join(' · ');
    $('detail').innerHTML = `
      <div><h2>${esc(c.name)}</h2><div class="sub"><span class="pill ${c.market}">${c.market}</span><span class="num">${esc(c.ticker)}</span><span>${esc(c.exchange || '')}</span><span>${esc(c.industry || c.sector || '')}</span><span>${links}</span></div></div>
      <div class="score-big"><div><div class="v">${c.score == null ? '–' : c.score.toFixed(1)}</div><div style="font-size:12px;color:var(--fg-3)">talent score</div></div>
        <div><div class="v" style="font-size:28px">${cov(c).toFixed(2)}</div><div style="font-size:12px;color:var(--fg-3)">coverage</div></div>
        <div><div class="v" style="font-size:28px">${peopleN(c)}</div><div style="font-size:12px;color:var(--fg-3)">named people</div></div></div>
      <section><h3>Score components</h3><div class="comp">${comps.map(([key, label, col]) => `<span>${label} <span class="w">×${w[key]}%</span></span><div class="track" title="${label} ${k[key] ?? '–'}"><div class="fill" style="width:${k[key] || 0}%;background:${col}"></div></div><span class="num" style="text-align:right">${k[key] == null ? '–' : (key === 'integrity' ? '−' : '') + k[key]}</span>`).join('')}</div>
        <details style="margin-top:10px"><summary>Every contributing signal</summary><pre class="explain">${esc((c.explain || []).join('\n'))}</pre></details></section>
      <section><h3>People (${(c.people || []).length} shown${M.include_people ? '' : ' · board and officers only in this build'})</h3><div class="people">${(c.people || []).length ? c.people.map(p => `<div class="person"><span class="n">${esc(p.name)} <span class="pill">${esc(p.role)}</span>${p.independent ? ' <span class="pill">independent</span>' : ''}</span><span class="sc">${p.score == null ? '' : p.score}</span><span class="t">${esc(p.title || '')}</span><span></span>
          <span class="meta">${p.education.map(e => '🎓 ' + esc(e)).join(' · ')}${p.past.length ? ' · prev: ' + p.past.map(esc).join('; ') : ''}${p.h_index ? ' · h-index ' + p.h_index : ''}${p.patents ? ' · ' + p.patents + ' patents' : ''}</span>
          <span class="meta"><span class="chip ${p.authenticity === 'clearly_genuine' ? 'good' : p.authenticity === 'contradicted' ? 'critical' : 'neutral'}">${esc(p.authenticity.replace('_', ' '))} · tier ${p.tier}</span><span>sources: ${p.sources.join(', ')}</span>${p.source_urls.slice(0, 3).map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">[${i + 1}]</a>`).join(' ')}${p.flags.length ? ' <span class="chip critical">⚠ ' + esc(p.flags[0]) + '</span>' : ''}</span>
          ${p.explain && p.explain.length ? `<details style="grid-column:1/-1"><summary>why ${p.score ?? ''}</summary><pre class="explain">${esc(p.explain.join('\n'))}</pre></details>` : ''}</div>`).join('') : '<div style="color:var(--fg-3);font-size:13px">No resolved people yet for this company.</div>'}</div></section>
      <section><h3>Headcount</h3>${spark(h.timeseries)}<dl class="kv" style="margin-top:8px"><dt>Reported</dt><dd class="num">${fmt.n(h.total)}${h.as_of ? ' as of ' + h.as_of : ''}</dd><dt>Growth</dt><dd class="num">${['yoy', 'two_years'].map(p => g[p] == null ? '' : p + ' ' + (g[p] > 0 ? '+' : '') + g[p] + '%').filter(Boolean).join(' · ') || '–'}</dd>
        <dt>Open roles</dt><dd class="num">${(c.hiring || {}).openings_count ?? '–'}${c.roles && c.roles.length ? ' · ' + esc(c.roles.slice(0, 6).join(', ')) : ''}</dd></dl></section>
      <section><h3>Integrity &amp; insiders</h3><div class="chips" style="margin-bottom:8px">${flags(c).map(f => `<span class="chip ${f[0]}">${f[1]} ${esc(f[2])}</span>`).join('')}</div>
        <dl class="kv"><dt>Last filing</dt><dd>${esc(c.regulatory.last_filing_date || '–')}</dd><dt>Insider 12m</dt><dd class="num">${c.insider.officer_buys_12m} buys · ${c.insider.officer_sells_12m} sells${c.insider.net_value != null ? ' · net ' + fmt.money(c.insider.net_value, c.currency) : ''}</dd></dl>
        ${(c.evidence || []).length ? '<ul class="plain" style="margin-top:8px">' + c.evidence.map(e => `<li><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.note || e.kind)}</a></li>`).join('') + '</ul>' : ''}</section>
      ${(c.executive_moves || []).length ? `<section><h3>Executive moves</h3><ul class="plain">${c.executive_moves.map(m => `<li>${esc(m.date || '')} ${esc(m.event)}: ${esc(m.name)}${m.title ? ', ' + esc(m.title) : ''}${m.source && m.source.url ? ` <a href="${esc(m.source.url)}" target="_blank" rel="noopener">[src]</a>` : ''}</li>`).join('')}</ul></section>` : ''}
      ${(c.signals || []).length ? `<section><h3>What changed since the last run</h3><ul class="plain">${c.signals.map(s => `<li><span class="num">${esc(s.type)}</span> ${esc(JSON.stringify(Object.fromEntries(Object.entries(s).filter(([k]) => !['type', 'at'].includes(k)))))}</li>`).join('')}</ul></section>` : ''}
      ${c.description ? `<section><h3>About</h3><div style="font-size:13px;color:var(--fg-2);max-width:65ch">${esc(c.description)}</div></section>` : ''}`;
    $('panel').classList.add('open'); $('scrim').hidden = false;
    try { localStorage.setItem('ptb.sel', id); } catch (e) {}
  }
  function close() { $('panel').classList.remove('open'); $('scrim').hidden = true; selId = null; render(); }

  ['q', 'market', 'sector', 'mincov', 'hideflag'].forEach(id => $(id).addEventListener('input', () => { $('mincovv').textContent = (+$('mincov').value).toFixed(1); render(); try { localStorage.setItem('ptb.' + id, $(id).type === 'checkbox' ? $(id).checked : $(id).value); } catch (e) {} }));
  document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; if (sortK === k) sortAsc = !sortAsc; else { sortK = k; sortAsc = k === 'rank' || k === 'name'; }
    document.querySelectorAll('th').forEach(t => t.classList.remove('sorted', 'asc')); th.classList.add('sorted'); if (sortAsc) th.classList.add('asc'); render(); }));
  $('rows').addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (tr) open(tr.dataset.id); });
  $('rows').addEventListener('keydown', e => { const tr = e.target.closest('tr.row'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(tr.dataset.id); } });
  $('close').addEventListener('click', close); $('scrim').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $('foot').textContent = 'Sources: SEC EDGAR, company websites and annual reports, ClinicalTrials.gov, OpenAlex, PatentsView, GitHub, Yahoo Finance. Personal research tool; not investment advice.';
  try { ['q', 'market', 'sector', 'mincov'].forEach(id => { const v = localStorage.getItem('ptb.' + id); if (v != null) $(id).value = v; }); $('hideflag').checked = localStorage.getItem('ptb.hideflag') === 'true'; $('mincovv').textContent = (+$('mincov').value).toFixed(1); } catch (e) {}
  render();
  if (location.hash && location.hash.length > 1) { const t = location.hash.slice(1); const c = C.find(x => x.ticker === t || x.company_id === t); if (c) open(c.company_id); }
})();
</script>
